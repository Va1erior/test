<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Менеджер книжной библиотеки</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1 id="main-title" class="clickable-title">📚 Моя библиотека</h1>
      <button id="toggle-form-btn" class="btn btn-primary">+ Добавить книгу</button>
    </header>

    <!-- Панель фильтров и поиска -->
    <section class="filters">
      <input type="text" id="search-input" placeholder="Поиск по названию или автору...">
      <select id="status-filter">
        <option value="">Все статусы</option>
        <option value="read">Прочитана</option>
        <option value="unread">Не прочитана</option>
      </select>
      <!-- Новый фильтр по жанру -->
      <select id="genre-filter">
        <option value="">Все жанры</option>
        <!-- опции заполняются динамически из js -->
      </select>
      <select id="sort-select">
        <option value="title-asc">Название (А-Я)</option>
        <option value="title-desc">Название (Я-А)</option>
        <option value="year-asc">Год (по возрастанию)</option>
        <option value="year-desc">Год (по убыванию)</option>
      </select>
      <!-- Кнопка быстрого фильтра "Прочитано" -->
      <button id="read-filter-btn" class="btn btn-outline">✅ Прочитано</button>
      <!-- Кнопка сброса "Моя библиотека" рядом -->
      <button id="reset-filters-btn" class="btn btn-outline">🔄 Все книги</button>
    </section>

    <!-- Панель добавления/редактирования -->
    <div id="book-form-panel" class="form-panel" style="display: none;">
      <h2 id="form-panel-title">Добавить книгу</h2>
      <form id="book-form">
        <input type="hidden" id="book-id">
        <div class="form-group">
          <label for="title">Название *</label>
          <input type="text" id="title" required>
        </div>
        <div class="form-group">
          <label for="author">Автор *</label>
          <input type="text" id="author" required>
        </div>
        <div class="form-group">
          <label for="year">Год издания *</label>
          <input type="number" id="year" min="1000" max="2026" required>
        </div>
        <div class="form-group">
          <label for="genre">Жанр *</label>
          <input type="text" id="genre" required>
        </div>
        <div class="form-group">
          <label for="status">Статус</label>
          <select id="status">
            <option value="unread">Не прочитана</option>
            <option value="read">Прочитана</option>
          </select>
        </div>
        <div id="form-errors" class="error-container"></div>
        <button type="submit" class="btn btn-success">Сохранить</button>
        <button type="button" id="cancel-edit-btn" class="btn btn-secondary" style="display: none;">Отмена</button>
      </form>
    </div>

    <!-- Контейнер для карточек книг -->
    <div id="books-container" class="books-grid"></div>

    <!-- Сообщение, когда книг нет -->
    <p id="empty-message" class="empty-message" style="display: none;">Книги не найдены.</p>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
